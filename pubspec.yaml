name: kafiltuk
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  intl: ^0.19.0
  go_router: ^14.6.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appIcon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/


  fonts:
    - family: Cario
      fonts:
        - asset: assets/fonts/Cairo-Bold.ttf

    - family: Noto
      fonts:
        - asset: assets/fonts/NotoSansArabic-Bold.ttf

    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
    
